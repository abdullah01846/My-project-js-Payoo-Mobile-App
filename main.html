<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <!-- daysiUI cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-800">
    <section class="max-w-md min-h-screen mx-auto py-6 bg-gray-100">
      <header>
        <nav class="flex justify-around items-center">
          <div class="flex mr-27">
            <img class="w-16" src="./assets/Group.png" alt="" />
            <div class="ml-2">
              <h1 class="font-bold text-2xl">
                $<span id="main-balance">4500</span>
              </h1>
              <p
                class="text-gray-500 text-xs border p-1 rounded-lg bg-slate-200"
              >
                Available Balance
              </p>
            </div>
          </div>
          <button class="btn">logout</button>
        </nav>
        <hr class="mt-3 text-gray-300" />
        <section>
          <h1 class="text-2xl font-bold mt-8 mb-4">🔥 Welcome to Payooo!</h1>
          <p class="text-gray-500 pl-3">
            Enjoy easy and convenient financial services with us. Cashout charge
            is low and
          </p>

          <div class="cards grid grid-cols-3 mt-14 gap-3 m-4">
            <!-- card 1 -->
            <div id="add-money-box" class="cursor-pointerbox border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets/wallet1.png" alt="" />
              <h3>Add Money</h3>
            </div>
            <!-- card 2 -->
            <div id="cashout-box" class="box border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets/bonus1.png" alt="" />
              <h3>Cash Out</h3>
            </div>
            <!-- card 3 -->
            <div class="box border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets/money1.png" alt="" />
              <h3>Transfer Money</h3>
            </div>
            <!-- card 4 -->
            <div class="box border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets//purse1.png" alt="" />
              <h3>Get Bonus</h3>
            </div>
            <!-- card 5 -->
            <div class="box border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets/send1.png" alt="" />
              <h3>Pay Bill</h3>
            </div>
            <!-- card 6 -->
            <div class="box border p-4 text-center rounded-lg">
              <img class="w-9 mx-auto" src="./assets/transaction1.png" alt="" />
              <h3>Transoctions</h3>
            </div>
          </div>
          <!-- Add money section -->
          <section id="addmoney">
            <h2>Add Money</h2>
            <div class="">
              <div class="hero-content flex-col lg:flex-row-reverse">
                <div class="card w-full max-w-sm shrink-0">
                  <div class="card-body">
                    <legend>Select Bank</legend>
                    <select class="select appearance-none">
                      <option disabled selected>Bank</option>
                      <option value="Bkash">Bkash</option>
                      <option value="Nagad">Nagad</option>
                      <option value="DBBL">DBBL</option>
                    </select>
                    <fieldset class="fieldset">
                      <label class="label">Mobile Number</label>
                      <input
                        value="01846464480"
                        id="Acount-Number"
                        type="number"
                        class="input"
                        placeholder="Enter your number"
                        required
                      />
                      <label class="label">Amount</label>
                      <input
                        id="Acount"
                        type="number"
                        class="input"
                        placeholder="Enter your Amount"
                        required
                      />
                      <label class="label">4 Digit pin</label>
                      <input
                        value="1234"
                        id="pin"
                        type="text"
                        class="input"
                        placeholder="Enter your 4 Digit Pin"
                        required
                      />
                      <div><a class="link link-hover">Forgot password?</a></div>
                      <button
                        id="add-money"
                        id="login-btn"
                        class="btn btn-neutral bg-blue-700 mt-4"
                      >
                        Add Money
                      </button>
                    </fieldset>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </section>
      </header>

       <!-- section 2 -->
    <section id="cashout" class="">
      <h2>Cash out</h2>
      <fieldset class="fieldset">
        <label class="label">Mobile Number</label>
        <input
          value="01846464480"
          id="Acount-Number"
          type="number"
          class="input"
          placeholder="Enter your number"
          required
        />
        <label class="label">Amount</label>
        <input
          id="cashout-amount"
          type="number"
          class="input"
          placeholder="Enter your Amount"
          required
        />
        <label class="label">4 Digit pin</label>
        <input
          value="1234"
          id="cashout-pin"
          type="text"
          class="input"
          placeholder="Enter your 4 Digit Pin"
          required
        />
        <div><a class="link link-hover">Forgot password?</a></div>
        <button
          id="cashout-btn"
          id="login-btn"
          class="btn btn-neutral bg-blue-700 mt-4"
        >
          Cashout
        </button>
      </fieldset>
    </section>
    </section>
   
    <script src="./script/add-money.js"></script>
    <script src="./script/toggle.js"></script>
    <script src="./script/cashout.js"></script>
  </body>
</html>
